<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sin conexión · ProPymes Asesores</title>
<style>
  :root{--navy:#07213d;--sand:#d2b48c;--cream:#f4ede5;--ink:#5f5549}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(24px,env(safe-area-inset-top)) 28px max(24px,env(safe-area-inset-bottom));
    background:var(--cream);color:var(--navy);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center}
  img{width:min(260px,70vw);height:auto}
  h1{margin:8px 0 0;font-size:22px}
  p{margin:0;max-width:320px;color:var(--ink)}
  button{margin-top:10px;min-width:200px;height:48px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:600 16px/1 inherit;font-family:inherit}
  button:active{transform:scale(.98)}
</style>
</head>
<body>
  <img src="logo.png" alt="ProPymes Asesores">
  <h1>Sin conexión</h1>
  <p>No hemos podido conectar con tu área de cliente. Comprueba que tienes internet y vuelve a intentarlo.</p>
  <button type="button" onclick="location.href='https://app.propymesasesores.es/'">Reintentar</button>
</body>
</html>
